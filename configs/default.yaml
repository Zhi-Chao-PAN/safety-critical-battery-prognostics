# Default experiment configuration — LSTM BASELINE COMPARISON
# NOTE: This config is for baseline model evaluation (LSTM, not PINN).
# PINN training uses PINNModel.__init__() parameters directly.
# See scripts/validate_real_data.py for PINN experiment setup.
name: "baseline_comparison"
seed: 42
seeds: [42, 43, 44, 45, 46]
device: "cpu"  # Baseline runs on CPU; PINN uses its own device config

data:
  data_dir: "data/battery_data"
  datasets: ["nasa"]
  eol_fraction: 0.7
  rated_capacity: 2.0
  val_fraction: 0.2

features:
  rolling_windows: [5, 10, 20]
  include_ic_dv: true
  include_frequency: true
  include_trends: true

model:
  name: "lstm"
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  seq_length: 30
  lr: 0.001
  epochs: 100
  patience: 10
  mc_samples: 100

safety:
  rul_critical: 10.0
  rul_warning: 30.0
  epistemic_threshold_low: 5.0
  epistemic_threshold_high: 15.0

output_dir: "results"
