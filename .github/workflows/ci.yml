name: Battery Research CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install formatting tools
      run: |
        pip install black flake8 mypy isort
    - name: Check formatting with black
      run: black --check --diff .
    - name: Lint with flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Type check with mypy
      run: mypy --ignore-missing-imports src/ --no-implicit-optional

  test-scientific:
    runs-on: ubuntu-latest
    needs: lint-and-format
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install scientific dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    - name: Run scientific tests
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=junit.xml \
            -n auto
        else
          echo "No tests directory found"
        fi
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          junit.xml
          coverage.xml
          htmlcov/

  reproducibility-check:
    runs-on: ubuntu-latest
    needs: test-scientific
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run reproducibility verification
      run: |
        echo "=== Reproducibility Verification ==="
        
        # Check random seeds
        python -c "
        import numpy as np
        import torch
        import random
        
        # Set seeds
        np.random.seed(42)
        torch.manual_seed(42)
        random.seed(42)
        
        # Generate random numbers
        np_arr = np.random.randn(5)
        torch_tensor = torch.randn(5)
        
        print('NumPy random values:', np_arr)
        print('PyTorch random values:', torch_tensor)
        print('Seeding verification passed')
        "
        
        # Check environment versions
        python -c "
        import sys
        import numpy as np
        import torch
        import pymc as pm
        
        print(f'Python: {sys.version}')
        print(f'NumPy: {np.__version__}')
        print(f'PyTorch: {torch.__version__}')
        print(f'PyMC: {pm.__version__}')
        "
        
        # Verify data paths if they exist
        if [ -f "scripts/verify_data.py" ]; then
          python scripts/verify_data.py
        fi

  documentation:
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-scientific]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install documentation tools
      run: |
        pip install mkdocs-material pymdown-extensions mkdocstrings[python]
    - name: Build documentation
      run: |
        mkdir -p site
        # Create basic docs if mkdocs.yml doesn't exist
        if [ ! -f "mkdocs.yml" ]; then
          cat > mkdocs.yml << 'EOF'
        site_name: Battery Prognostics Documentation
        theme:
          name: material
        nav:
          - Home: index.md
          - API: api.md
        EOF
          
          mkdir -p docs
          cat > docs/index.md << 'EOF'
        # Battery Prognostics Research
        
        ## Overview
        This project compares Hierarchical Bayesian Models vs. LSTM for battery RUL prediction.
        
        ## Quick Start
        ```bash
        pip install -r requirements.txt
        bash run_all_experiments.sh
        ```
        
        ## Citation
        ```bibtex
        @software{pan2025battery,
          author = {Pan, Zhichao},
          title = {Safety-Critical Battery Prognostics: Bayesian vs. DL},
          year = {2025},
          url = {https://github.com/Zhi-Chao-PAN/safety-critical-battery-prognostics}
        }
        ```
        EOF
        fi
        
        mkdocs build --site-dir site
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        keep_files: false

  security-scan:
    runs-on: ubuntu-latest
    needs: test-scientific
    steps:
    - uses: actions/checkout@v4
    - name: Run security scan
      run: |
        echo "Security scan placeholder"
        # In production, add tools like:
        # bandit, safety, trivy, etc.
        echo "Security checks would run here"

  notify:
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-scientific, reproducibility-check]
    if: always()
    
    steps:
    - name: Notify status
      run: |
        echo "CI Pipeline completed"
        echo "Lint: ${{ needs.lint-and-format.result }}"
        echo "Test: ${{ needs.test-scientific.result }}"
        echo "Reproducibility: ${{ needs.reproducibility-check.result }}"